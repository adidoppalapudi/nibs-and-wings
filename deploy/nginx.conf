# /etc/nginx/sites-available/nib-and-wings
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/nib-and-wings
#   sudo ln -s /etc/nginx/sites-available/nib-and-wings /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace every YOUR_DOMAIN below with your actual hostname first.
#
# Install this file BEFORE running certbot. Certbot reads the server_name from
# here, adds the TLS block, and rewrites port 80 into a redirect for you.

# Cap login attempts at the edge as well as in the app. 5r/m per IP, with a
# small burst so a fat-fingered password doesn't lock you out instantly.
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # certbot writes its challenge files here.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # certbot --nginx fills these in. Until then, comment out this whole server
    # block and let the port-80 block serve the site directly.
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/nib-and-wings.access.log;
    error_log  /var/log/nginx/nib-and-wings.error.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Each upload includes the original plus a browser-generated preview. The
    # app permits an individual file up to 25 MB.
    client_max_body_size 30m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # nginx serves uploaded images straight off disk. No reason to wake Node
    # for a static JPEG. Filenames are unique per upload, so they cache forever.
    location /uploads/ {
        alias /srv/nib-and-wings/uploads/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Never execute anything that lands in here.
        location ~ \.(php|js|html|htm|svg)$ { return 403; }
        try_files $uri =404;
    }

    location = /api/login {
        limit_req zone=login burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }
}
